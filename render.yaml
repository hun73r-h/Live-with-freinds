services:
  - type: web
    name: live-with-frens
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: METERED_DOMAIN
        sync: false
      - key: METERED_API_KEY
        sync: false
